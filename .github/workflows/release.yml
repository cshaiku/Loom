name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            runner: ubuntu-latest
            archive: tar
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
            runner: macos-15-intel
            archive: tar
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
            runner: macos-latest
            archive: tar
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            runner: windows-latest
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe
            runner: windows-11-arm
            archive: zip

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          mkdir -p dist/loom-${{ matrix.suffix }}
          go build -trimpath -ldflags="-s -w" -o dist/loom-${{ matrix.suffix }}/loom${{ matrix.ext }} ./cmd/loom
          cp -R patterns dist/loom-${{ matrix.suffix }}/patterns
          cp README.md LICENSE VERSION dist/loom-${{ matrix.suffix }}/

      - name: Native smoke
        shell: bash
        run: |
          ./dist/loom-${{ matrix.suffix }}/loom${{ matrix.ext }} version
          ./dist/loom-${{ matrix.suffix }}/loom${{ matrix.ext }} verify --json

      - name: Archive Unix
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          cd dist
          tar -czf loom-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz loom-${{ matrix.suffix }}

      - name: Archive Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/loom-${{ matrix.suffix }}" -DestinationPath "dist/loom-${{ github.ref_name }}-${{ matrix.suffix }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loom-${{ github.ref_name }}-${{ matrix.suffix }}.*
