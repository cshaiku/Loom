name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/loom-${{ matrix.suffix }}
          go build -trimpath -ldflags="-s -w" -o dist/loom-${{ matrix.suffix }}/loom${{ matrix.ext }} ./cmd/loom
          cp -R patterns dist/loom-${{ matrix.suffix }}/patterns
          cp README.md LICENSE VERSION dist/loom-${{ matrix.suffix }}/

      - name: Smoke archive command
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/loom-${{ matrix.suffix }}/loom verify --json

      - name: Archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r loom-${{ github.ref_name }}-${{ matrix.suffix }}.zip loom-${{ matrix.suffix }}
          else
            tar -czf loom-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz loom-${{ matrix.suffix }}
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loom-${{ github.ref_name }}-${{ matrix.suffix }}.*
